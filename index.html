<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cotton Candy Weather</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background: linear-gradient(135deg, #ffb6c1, #dda0dd, #b0e0e6);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .container {
            width: 100%;
            max-width: 450px;
            background: rgba(255, 255, 255, 0.9);
            border-radius: 25px;
            box-shadow: 0 15px 30px rgba(0, 0, 0, 0.1);
            overflow: hidden;
            position: relative;
        }

        .header {
            background: linear-gradient(135deg, #ff9a9e, #fad0c4);
            padding: 25px 30px;
            text-align: center;
            color: white;
            position: relative;
        }

        .header h1 {
            font-size: 28px;
            margin-bottom: 5px;
            text-shadow: 1px 1px 3px rgba(0, 0, 0, 0.2);
        }

        .header p {
            font-size: 14px;
            opacity: 0.9;
        }

        .cotton-candy {
            position: absolute;
            width: 80px;
            height: 80px;
            background: radial-gradient(circle at 30% 30%, #ff9a9e, #fad0c4, #a2d2ff);
            border-radius: 50%;
            top: -30px;
            right: 30px;
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.1);
        }

        .cotton-candy::before {
            content: '';
            position: absolute;
            width: 40px;
            height: 40px;
            background: radial-gradient(circle at 30% 30%, #ff9a9e, #fad0c4, #a2d2ff);
            border-radius: 50%;
            top: 10px;
            left: -20px;
        }

        .cotton-candy::after {
            content: '';
            position: absolute;
            width: 30px;
            height: 30px;
            background: radial-gradient(circle at 30% 30%, #ff9a9e, #fad0c4, #a2d2ff);
            border-radius: 50%;
            bottom: 5px;
            right: -15px;
        }

        .search-container {
            padding: 20px;
            display: flex;
            gap: 10px;
        }

        .search-input {
            flex: 1;
            padding: 12px 20px;
            border: none;
            border-radius: 50px;
            background: #f8f8f8;
            font-size: 16px;
            box-shadow: inset 0 2px 5px rgba(0, 0, 0, 0.05);
            outline: none;
        }

        .search-input:focus {
            box-shadow: inset 0 2px 5px rgba(0, 0, 0, 0.1), 0 0 0 2px #ff9a9e;
        }

        .search-btn {
            background: linear-gradient(135deg, #ff9a9e, #fad0c4);
            border: none;
            border-radius: 50%;
            width: 50px;
            height: 50px;
            color: white;
            font-size: 18px;
            cursor: pointer;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.1);
            transition: transform 0.2s;
        }

        .search-btn:hover {
            transform: scale(1.05);
        }

        .location-btn {
            background: linear-gradient(135deg, #a2d2ff, #bde0fe);
            border: none;
            border-radius: 50%;
            width: 50px;
            height: 50px;
            color: white;
            font-size: 18px;
            cursor: pointer;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.1);
            transition: transform 0.2s;
        }

        .location-btn:hover {
            transform: scale(1.05);
        }

        .weather-info {
            padding: 20px 30px;
            text-align: center;
        }

        .location {
            font-size: 24px;
            font-weight: 600;
            color: #333;
            margin-bottom: 5px;
        }

        .date {
            font-size: 14px;
            color: #666;
            margin-bottom: 20px;
        }

        .temperature {
            font-size: 72px;
            font-weight: 700;
            background: linear-gradient(135deg, #ff9a9e, #a2d2ff);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin: 10px 0;
            line-height: 1;
        }

        .weather-icon {
            font-size: 80px;
            margin: 15px 0;
            background: linear-gradient(135deg, #ff9a9e, #a2d2ff);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .description {
            font-size: 20px;
            color: #555;
            margin-bottom: 25px;
            text-transform: capitalize;
        }

        .details {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
            margin-top: 20px;
        }

        .detail-item {
            background: rgba(255, 255, 255, 0.7);
            padding: 15px;
            border-radius: 15px;
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.05);
        }

        .detail-item i {
            font-size: 24px;
            margin-bottom: 8px;
            background: linear-gradient(135deg, #ff9a9e, #a2d2ff);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .detail-label {
            font-size: 14px;
            color: #777;
            margin-bottom: 5px;
        }

        .detail-value {
            font-size: 18px;
            font-weight: 600;
            color: #444;
        }

        .loading {
            text-align: center;
            padding: 40px;
            color: #ff9a9e;
            font-size: 18px;
        }

        .error {
            text-align: center;
            padding: 20px;
            color: #ff6b6b;
            background: rgba(255, 107, 107, 0.1);
            margin: 20px;
            border-radius: 15px;
        }

        .footer {
            text-align: center;
            padding: 15px;
            font-size: 12px;
            color: #888;
            background: rgba(255, 255, 255, 0.7);
        }

        @media (max-width: 480px) {
            .container {
                border-radius: 20px;
            }
            
            .header h1 {
                font-size: 24px;
            }
            
            .temperature {
                font-size: 60px;
            }
            
            .weather-icon {
                font-size: 70px;
            }
            
            .details {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <div class="cotton-candy"></div>
            <h1>Cotton Candy Weather</h1>
            <p>Sweet forecasts for your day!</p>
        </div>
        
        <div class="search-container">
            <input type="text" class="search-input" placeholder="Enter city name...">
            <button class="search-btn"><i class="fas fa-search"></i></button>
            <button class="location-btn"><i class="fas fa-location-arrow"></i></button>
        </div>
        
        <div class="weather-info">
            <div class="loading" id="loading">Fetching weather data...</div>
            
            <div id="weather-data" style="display: none;">
                <div class="location" id="location">New York, US</div>
                <div class="date" id="date">Monday, June 12, 2023</div>
                <div class="weather-icon">
                    <i class="fas fa-sun" id="weather-icon"></i>
                </div>
                <div class="temperature" id="temperature">24°C</div>
                <div class="description" id="description">Sunny</div>
                
                <div class="details">
                    <div class="detail-item">
                        <i class="fas fa-wind"></i>
                        <div class="detail-label">Wind Speed</div>
                        <div class="detail-value" id="wind-speed">5 km/h</div>
                    </div>
                    <div class="detail-item">
                        <i class="fas fa-tint"></i>
                        <div class="detail-label">Humidity</div>
                        <div class="detail-value" id="humidity">65%</div>
                    </div>
                    <div class="detail-item">
                        <i class="fas fa-temperature-low"></i>
                        <div class="detail-label">Feels Like</div>
                        <div class="detail-value" id="feels-like">26°C</div>
                    </div>
                    <div class="detail-item">
                        <i class="fas fa-compress-arrows-alt"></i>
                        <div class="detail-label">Pressure</div>
                        <div class="detail-value" id="pressure">1012 hPa</div>
                    </div>
                </div>
            </div>
            
            <div class="error" id="error" style="display: none;">
                Unable to fetch weather data. Please try again.
            </div>
        </div>
        
        <div class="footer">
            <p>Data provided by OpenWeatherMap</p>
        </div>
    </div>

    <script>
        // DOM Elements
        const searchInput = document.querySelector('.search-input');
        const searchBtn = document.querySelector('.search-btn');
        const locationBtn = document.querySelector('.location-btn');
        const loadingEl = document.getElementById('loading');
        const weatherDataEl = document.getElementById('weather-data');
        const errorEl = document.getElementById('error');
        
        // Weather data elements
        const locationEl = document.getElementById('location');
        const dateEl = document.getElementById('date');
        const weatherIconEl = document.getElementById('weather-icon');
        const temperatureEl = document.getElementById('temperature');
        const descriptionEl = document.getElementById('description');
        const windSpeedEl = document.getElementById('wind-speed');
        const humidityEl = document.getElementById('humidity');
        const feelsLikeEl = document.getElementById('feels-like');
        const pressureEl = document.getElementById('pressure');
        
        // API Key (In a real app, this would be stored securely)
        const API_KEY = 'your_api_key_here'; // Replace with your actual API key
        
        // Initialize the app
        document.addEventListener('DOMContentLoaded', () => {
            // Try to get weather by user's location on app start
            getWeatherByLocation();
            
            // Add event listeners
            searchBtn.addEventListener('click', () => {
                const city = searchInput.value.trim();
                if (city) {
                    getWeatherByCity(city);
                }
            });
            
            searchInput.addEventListener('keypress', (e) => {
                if (e.key === 'Enter') {
                    const city = searchInput.value.trim();
                    if (city) {
                        getWeatherByCity(city);
                    }
                }
            });
            
            locationBtn.addEventListener('click', getWeatherByLocation);
        });
        
        // Get weather by city name
        async function getWeatherByCity(city) {
            showLoading();
            
            try {
                const response = await fetch(
                    `https://api.openweathermap.org/data/2.5/weather?q=${city}&appid=${API_KEY}&units=metric`
                );
                
                if (!response.ok) {
                    throw new Error('City not found');
                }
                
                const data = await response.json();
                displayWeatherData(data);
            } catch (error) {
                showError('Unable to find the city. Please check the spelling and try again.');
            }
        }
        
        // Get weather by user's location
        function getWeatherByLocation() {
            showLoading();
            
            if (!navigator.geolocation) {
                showError('Geolocation is not supported by your browser.');
                return;
            }
            
            navigator.geolocation.getCurrentPosition(
                async (position) => {
                    const { latitude, longitude } = position.coords;
                    
                    try {
                        const response = await fetch(
                            `https://api.openweathermap.org/data/2.5/weather?lat=${latitude}&lon=${longitude}&appid=${API_KEY}&units=metric`
                        );
                        
                        if (!response.ok) {
                            throw new Error('Weather data not available');
                        }
                        
                        const data = await response.json();
                        displayWeatherData(data);
                    } catch (error) {
                        showError('Unable to fetch weather data for your location.');
                    }
                },
                (error) => {
                    showError('Unable to retrieve your location. Please enable location services or search for a city.');
                }
            );
        }
        
        // Display weather data
        function displayWeatherData(data) {
            // Update location
            locationEl.textContent = `${data.name}, ${data.sys.country}`;
            
            // Update date
            const now = new Date();
            dateEl.textContent = formatDate(now);
            
            // Update temperature
            temperatureEl.textContent = `${Math.round(data.main.temp)}°C`;
            
            // Update weather description and icon
            descriptionEl.textContent = data.weather[0].description;
            updateWeatherIcon(data.weather[0].icon);
            
            // Update details
            windSpeedEl.textContent = `${data.wind.speed} m/s`;
            humidityEl.textContent = `${data.main.humidity}%`;
            feelsLikeEl.textContent = `${Math.round(data.main.feels_like)}°C`;
            pressureEl.textContent = `${data.main.pressure} hPa`;
            
            // Show weather data and hide loading/error
            weatherDataEl.style.display = 'block';
            loadingEl.style.display = 'none';
            errorEl.style.display = 'none';
        }
        
        // Update weather icon based on weather condition
        function updateWeatherIcon(iconCode) {
            const iconMap = {
                '01d': 'fas fa-sun',
                '01n': 'fas fa-moon',
                '02d': 'fas fa-cloud-sun',
                '02n': 'fas fa-cloud-moon',
                '03d': 'fas fa-cloud',
                '03n': 'fas fa-cloud',
                '04d': 'fas fa-cloud',
                '04n': 'fas fa-cloud',
                '09d': 'fas fa-cloud-rain',
                '09n': 'fas fa-cloud-rain',
                '10d': 'fas fa-cloud-sun-rain',
                '10n': 'fas fa-cloud-moon-rain',
                '11d': 'fas fa-bolt',
                '11n': 'fas fa-bolt',
                '13d': 'fas fa-snowflake',
                '13n': 'fas fa-snowflake',
                '50d': 'fas fa-smog',
                '50n': 'fas fa-smog'
            };
            
            weatherIconEl.className = iconMap[iconCode] || 'fas fa-sun';
        }
        
        // Format date
        function formatDate(date) {
            const options = { weekday: 'long', year: 'numeric', month: 'long', day: 'numeric' };
            return date.toLocaleDateString('en-US', options);
        }
        
        // Show loading state
        function showLoading() {
            loadingEl.style.display = 'block';
            weatherDataEl.style.display = 'none';
            errorEl.style.display = 'none';
        }
        
        // Show error message
        function showError(message) {
            errorEl.textContent = message;
            errorEl.style.display = 'block';
            loadingEl.style.display = 'none';
            weatherDataEl.style.display = 'none';
        }
        
        // For demonstration purposes, we'll use mock data if API key is not provided
        if (API_KEY === 'your_api_key_here') {
            // Use mock data for demonstration
            const mockData = {
                name: 'Cotton Candy City',
                sys: { country: 'CC' },
                main: {
                    temp: 22,
                    feels_like: 24,
                    humidity: 65,
                    pressure: 1012
                },
                weather: [{ description: 'Partly cloudy', icon: '02d' }],
                wind: { speed: 3.5 }
            };
            
            // Override the API functions with mock data
            const originalGetWeatherByCity = getWeatherByCity;
            const originalGetWeatherByLocation = getWeatherByLocation;
            
            getWeatherByCity = function(city) {
                showLoading();
                setTimeout(() => {
                    mockData.name = city;
                    displayWeatherData(mockData);
                }, 800);
            };
            
            getWeatherByLocation = function() {
                showLoading();
                setTimeout(() => {
                    displayWeatherData(mockData);
                }, 800);
            };
            
            // Show a message about using demo data
            document.addEventListener('DOMContentLoaded', () => {
                setTimeout(() => {
                    const footer = document.querySelector('.footer');
                    footer.innerHTML += '<p style="color:#ff6b6b; margin-top:5px;">Using demo data. Add your API key for real weather information.</p>';
                }, 1000);
            });
        }
    </script>
</body>
</html>
